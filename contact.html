<style>
  :root{
    --bg:#121110;
    --bg-soft:#1b1917;
    --gold:#c9a13b;
    --teal:#3e7c78;
    --text:#f2ede4;
    --muted:#9a938a;
    --line:#2c2925;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    line-height:1.7;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 6vw 60px; }

  header{
    padding:20px 0;

  }

  .logo span{ color:var(--gold); }
  nav{ display:flex; gap:24px; }
  nav a{ font-size:.92rem; color:var(--muted); }
  nav a.active{ color:var(--gold); }
  nav a:hover{ color:var(--gold); }

  .page-title{
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:12px;
    text-align:center;
    padding:34px 20px;
    margin-bottom:40px;
  }
  .page-title span{ display:block; color:var(--muted); font-size:.95rem; margin-bottom:8px; }
  .page-title h1{ font-size:1.6rem; font-weight:800; }

  .contact-grid{
    display:grid;
    gap:16px;
  }
  .contact-card{
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px 24px;
    display:flex;
    align-items:center;
    gap:18px;
    transition:border-color .25s;
  }
  .contact-card:hover{ border-color:var(--gold); }
  .contact-icon{
    width:52px; height:52px; flex-shrink:0;
    border-radius:50%;
    background:rgba(201,161,59,.1);
    border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:1.2rem; font-weight:700;
  }
  .contact-info span{ display:block; color:var(--muted); font-size:.82rem; margin-bottom:4px; }
  .contact-info b{ font-size:1.05rem; font-weight:600; }

  .socials{
    margin-top:40px;
    text-align:center;
  }
  .socials p{ color:var(--muted); font-size:.9rem; margin-bottom:18px; }
  .social-row{ display:flex; justify-content:center; gap:16px; }
  .social-row a{
    width:46px; height:46px; border:1px solid var(--line); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:.85rem;
    transition:all .25s;
  }
  .social-row a:hover{ border-color:var(--gold); color:var(--gold); }

  .map-box{
    margin-top:40px;
    height:220px;
    border-radius:10px;
    border:1px solid var(--line);
    background:repeating-linear-gradient(45deg, #1b1917, #1b1917 18px, #201d1a 18px, #201d1a 36px);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.9rem;
  }

  @media (min-width:700px){
    .contact-grid{ grid-template-columns:repeat(2, 1fr); }
  }
